name: GitHub Pages

# Canlı demoyu yayımlar: https://dorukmemk.github.io/prompt-injection-simulation/
# Çalışması için depo ayarlarında Settings → Pages → Source = "GitHub Actions" seçili olmalı.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    name: Derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Üretim derlemesi
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Tek sayfa uygulaması için 404 yönlendirmesi
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    name: Yayınla
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
